const GT=[
()=>{const k=ri(1,9);return['Physics','Kinematics','Moderate',`A projectile is launched at 45° to the horizontal with speed ${10*k} m/s (g = 10 m/s²). Find its horizontal range in metres.`,10*k*k,`R = u²sin2θ/g = ${100*k*k}/10.`]},
()=>{const k=ri(1,8);return['Physics','Laws of Motion','Moderate',`Masses ${3*k} kg and ${k} kg hang over a light frictionless pulley (g = 10 m/s²). Find the string tension in N.`,15*k,'T = 2m₁m₂g/(m₁+m₂) = 15k.']},
()=>{const a=ri(1,9),m=ri(1,6),I=ri(1,5);return['Physics','Current Electricity','Hard',`A ${a} Ω resistor is in series with two ${2*m} Ω resistors connected in parallel, across a ${(a+m)*I} V battery. Find the current in A.`,I,`R = ${a} + ${m} = ${a+m} Ω, so I = V/R = ${I} A.`]},
()=>{const T1=100*ri(3,9),p=[20,25,40,50,60][ri(0,4)],T2=T1*(100-p)/100;return['Physics','Thermodynamics','Moderate',`A Carnot engine works between ${T1} K and ${T2} K. Find its efficiency in percent.`,p,`η = 1 − T₂/T₁ = ${p}%.`]},
()=>{const h=ri(5,40);return['Chemistry','Chemical Kinetics','Moderate',`A first-order reaction has half-life ${h} min. Time (in min) for 87.5% completion?`,3*h,'87.5% completion = 3 half-lives.']},
()=>{const w=20*ri(1,8);return['Chemistry','Mole Concept','Easy',`${w} g of NaOH (M = 40) is dissolved to make 500 mL of solution. Find the molarity (M).`,w/20,`n = ${w}/40 mol; M = n/0.5 = ${w/20}.`]},
()=>{const a=ri(1,9),d=ri(2,6),n=ri(8,20);return['Mathematics','Sequences & Series','Moderate',`Find the sum of the first ${n} terms of the AP with first term ${a} and common difference ${d}.`,n*(2*a+(n-1)*d)/2,'S = n/2 [2a + (n−1)d].']},
()=>{const n=ri(6,12),r=ri(2,4);return['Mathematics','Permutations & Combinations','Easy',`In how many ways can ${r} students be chosen from ${n} students?`,nC(n,r),`ⁿCᵣ = ${n}C${r}.`]},
()=>{const p=ri(1,5),q=ri(1,5),k=ri(1,4);return['Mathematics','Integration','Moderate',`Evaluate ∫ from 0 to ${k} of (${3*p}x² + ${2*q}x) dx.`,p*k**3+q*k**2,`= ${p}x³ + ${q}x² evaluated from 0 to ${k}.`]},
()=>{const m=[0,0,0].map(()=>[0,0,0].map(()=>ri(-3,5))),[a,b,c]=m[0],[d,e,f]=m[1],[g,h,i]=m[2];return['Mathematics','Matrices & Determinants','Hard',`Find the determinant of the matrix with rows [${m[0]}], [${m[1]}], [${m[2]}].`,a*(e*i-f*h)-b*(d*i-f*g)+c*(d*h-e*g),'Expand along the first row.']},
()=>{const r1=ri(1,9),r2=ri(1,9);return['Mathematics','Quadratic Equations','Moderate',`If α and β are the roots of x² − ${r1+r2}x + ${r1*r2} = 0, find α² + β².`,r1*r1+r2*r2,'α²+β² = (α+β)² − 2αβ.']},
()=>{const[a,b,c]=TRI[ri(0,4)],k=ri(1,6);return['Mathematics','Complex Numbers','Easy',`Find |z| for z = ${a*k} + ${b*k}i.`,c*k,'|z| = √(x²+y²).']},
()=>{const b=ri(0,1),m=ri(1,5),[nm,t,L]=b?['solid cylinder',3*m,15*m*m]:['thin ring',4*m,20*m*m];return['Physics','Rotational Motion','Hard',`A ${nm} rolls without slipping from rest down a 30° incline (g = 10 m/s²). It covers ${L} m along the incline. Find the time taken in s.`,t,'a = g sinθ/(1+k), then t = √(2L/a).']},
()=>{const[p,q,mu]=[[1,1,.5],[2,2,1],[3,1,.75],[1,3,.75],[2,6,1.5],[6,2,1.5],[4,4,2]][ri(0,6)],w=ri(1,6);return['Physics','Work, Energy & Power','Hard',`A ${p} kg block moving at ${4*w} m/s collides head-on and sticks to a ${q} kg block at rest on a smooth surface. Find the kinetic energy lost in J.`,8*mu*w*w,`ΔK = ½μv² with μ = m₁m₂/(m₁+m₂) = ${mu} kg.`]},
()=>{const c=ri(1,4),d=5-c,w=ri(1,5);return['Physics','Electrostatics','Hard',`A ${c} μF capacitor charged to ${10*w} V is connected across an uncharged ${d} μF capacitor. Find the heat dissipated in μJ.`,10*c*d*w*w,'Loss = ½·C₁C₂/(C₁+C₂)·V².']},
()=>{const B=ri(1,5),om=ri(1,10),l=ri(1,4);return['Physics','Magnetism & EMI','Hard',`A metal rod of length ${2*l} m rotates about one end in a plane perpendicular to a uniform field of ${B} T with angular speed ${om} rad/s. Find the emf induced between its ends in V.`,2*B*om*l*l,'ε = ½BωL².']},
()=>{const lam=ri(4,7)*100,D=ri(1,3),d=ri(1,2),beta=lam*D/d;return['Physics','Ray & Wave Optics','Hard',`In Young's double slit experiment λ = ${lam} nm, slit separation d = ${d} mm and screen distance D = ${D} m. Find the distance in μm between the 3rd bright fringe and the 7th dark fringe on the same side of the central maximum.`,3.5*beta,`β = λD/d = ${beta} μm; separation = (6.5 − 3)β.`]},
()=>{const[lam,E]=[[620,2],[310,4],[248,5],[155,8]][ri(0,3)],V1=ri(1,E-1);return['Physics','Modern Physics','Hard',`Light of wavelength ${lam} nm gives a stopping potential of ${V1} V on a metal (hc = 1240 eV·nm). Find the stopping potential in V when the wavelength is changed to one-third of ${lam} nm.`,2*E+V1,'φ = E − eV₁; new V = 3E − φ = 2E + V₁.']},
()=>{const p=ri(1,6),dv=ri(1,8);return['Physics','Thermodynamics','Hard',`A diatomic ideal gas expands isobarically at ${2*p} kPa, its volume increasing by ${dv} L. Find the heat absorbed in J.`,7*p*dv,'Q = (7/2)PΔV for a diatomic gas.']},
()=>{const g=ri(0,1),T=ri(4,16)*25;return['Physics','Thermodynamics','Hard',g?`A monatomic ideal gas at ${T} K is compressed adiabatically to 1/8 of its volume. Find its final temperature in K.`:`A diatomic ideal gas at ${T} K is compressed adiabatically to 1/32 of its volume. Find its final temperature in K.`,4*T,'TV^(γ−1) = constant gives T₂ = 4T₁.']},
()=>{const n=[2,4,8][ri(0,2)],w=ri(1,4);return['Physics','Gravitation','Moderate',`The orbital speed of a satellite just above Earth's surface is ${8*w} km/s. Find the orbital speed in km/s of a satellite at height ${n*n-1}R above the surface (R = Earth's radius).`,8*w/n,`v ∝ 1/√r with r = ${n*n}R.`]},
()=>{const om=ri(2,9),m=ri(1,4),k=m*om*om;return['Physics','Oscillations & Waves','Hard',`A ${m} kg block is attached to two identical springs of constant ${2*k} N/m each joined in series. Find its angular frequency of oscillation in rad/s.`,om,`k_eq = ${k} N/m and ω = √(k_eq/m).`]},
()=>{const k=ri(1,6),t=ri(1,5);return['Physics','Properties of Matter','Hard',`A tank of water stands on the ground with its water surface ${k+k*t*t} m above the ground. A small hole is made ${k} m below the water surface. Find the horizontal range in m of the jet on the ground.`,2*k*t,'Range = 2√(h(H−h)).']},
()=>{const[al,Pm,Km]=[[0.5,3,4],[0.6,4,9],[0.8,9,64],[0.2,6,1]][ri(0,3)],w=ri(1,6);return['Chemistry','Chemical Equilibrium','Hard',`N₂O₄ dissociates as N₂O₄ ⇌ 2NO₂. At a total equilibrium pressure of ${Pm*w} atm it is ${Math.round(al*100)}% dissociated. Find Kp in atm.`,Km*w,'Kp = 4α²P/(1−α²).']},
()=>{const n=ri(1,2),k=n==1?ri(1,6):2*ri(1,3),E=ri(60,120)*10;return['Chemistry','Electrochemistry','Hard',`A cell has E° = ${E} mV with n = ${n} and reaction quotient Q = 10^${k} (take 2.303RT/F = 59 mV). Find the cell potential in mV.`,E-59*k/n,'E = E° − (59/n) log Q.']},
()=>{const f=ri(1,5),m=ri(0,1),[nm,mm,ne]=m?['silver',108,1]:['aluminium',27,3];return['Chemistry','Electrochemistry','Moderate',`A current of 10 A is passed for ${9650*f} s through a ${nm} salt solution (${nm=='silver'?'Ag⁺':'Al³⁺'}, atomic mass ${mm}; 1 F = 96500 C). Find the mass deposited in g.`,mm*f/ne,`Charge = ${f} F; mass = ${f} × ${mm}/${ne}.`]},
()=>{const v=ri(2,3),n=ri(1,9);return['Chemistry','Solutions & Colligative','Hard',`${n} mol of an electrolyte giving ${v} ions per formula unit is dissolved in 1 kg of water with 50% dissociation (Kf = 2 K kg/mol). Find the depression in freezing point in K.`,(1+(v-1)*0.5)*2*n,'i = 1 + (ν−1)α; ΔTf = i·Kf·m.']},
()=>{const a=-ri(10,90)*10,b=ri(0,5)*10,c=-ri(10,90)*10;return['Chemistry','Thermodynamics (Chem)','Moderate',`ΔHf (kJ/mol) is ${a} for A, ${b} for B and ${c} for C. Find ΔH in kJ for A + 2B → 3C.`,3*c-a-2*b,'ΔH = ΣΔHf(products) − ΣΔHf(reactants).']},
()=>{const S=ri(5,15)*20,T=ri(6,20)*50;return['Chemistry','Thermodynamics (Chem)','Hard',`For a reaction ΔH = ${T*S/1000} kJ and ΔS = ${S} J/K, both independent of temperature. Find the temperature in K above which it is spontaneous.`,T,'ΔG = 0 at T = ΔH/ΔS.']},

()=>{const n=ri(2,9),m=3*ri(2,9);return['Chemistry','Mole Concept','Moderate',`${n} mol N₂ reacts with ${m} mol H₂ (N₂ + 3H₂ → 2NH₃, complete reaction). Find the moles of NH₃ formed.`,2*Math.min(n,m/3),'Find the limiting reagent first.']},
()=>{const x=ri(1,9),s=ri(0,1),u=s?(x<=5?x:10-x):(x<=3?x:x<=6?6-x:(x-6<=2?x-6:4-(x-6)));return['Chemistry','Coordination Compounds','Hard',`An octahedral complex of a d^${x} metal ion has a ${s?'weak':'strong'}-field ligand. Find its spin-only magnetic moment squared, μ², in BM².`,u*(u+2),'μ² = n(n+2), n = unpaired electrons.']}];

for(let i=0;i<0;i++){const t=Math.floor(i/5000),n=i%5000+1;let s,ch,d,q,a,e;
switch(t){
case 0:s='Physics';ch='Kinematics';d='Easy';q=`A body starts from rest and accelerates at 10 m/s² for ${n} s. Find its displacement in metres.`;a=5*n*n;e=`s = ½at² = 5×${n}² = ${a} m.`;break;
case 1:s='Physics';ch='Laws of Motion';d='Easy';{const m=n%25+1,acc=Math.floor(n/25)+1;q=`A ${m} kg body accelerates at ${acc} m/s². Find the net force in N.`;a=m*acc;e=`F = ma = ${m}×${acc} = ${a} N.`;}break;
case 2:s='Physics';ch='Work, Energy & Power';d='Easy';{const F=n%100+1,x=Math.floor(n/100)+1;q=`A constant force of ${F} N acts along a displacement of ${x} m. Find the work in J.`;a=F*x;e=`W = Fx = ${F}×${x} = ${a} J.`;}break;
case 3:s='Physics';ch='Current Electricity';d='Easy';{const R=n%100+1,I=Math.floor(n/100)+1;q=`A ${R} Ω resistor carries ${I} A current. Find the voltage across it in V.`;a=R*I;e=`V = IR = ${I}×${R} = ${a} V.`;}break;
case 4:s='Physics';ch='Current Electricity';d='Moderate';{const r1=n%100+1,r2=Math.floor(n/100)+1;q=`Two resistors ${r1} Ω and ${r2} Ω are connected in series. Find their equivalent resistance in Ω.`;a=r1+r2;e=`Series resistances add: ${r1}+${r2}=${a} Ω.`;}break;
case 5:s='Physics';ch='Electrostatics';d='Easy';{const C=n%100+1,V=Math.floor(n/100)+1;q=`A ${C} μF capacitor is connected to ${V} V. Find the stored charge in μC.`;a=C*V;e=`Q=CV=${C}×${V}=${a} μC.`;}break;
case 6:s='Physics';ch='Oscillations & Waves';d='Easy';{const f=n%200+1,lam=Math.floor(n/200)+1;q=`A wave has frequency ${f} Hz and wavelength ${lam} m. Find its speed in m/s.`;a=f*lam;e=`v=fλ=${f}×${lam}=${a} m/s.`;}break;
case 7:s='Chemistry';ch='Mole Concept';d='Easy';{const k=n;q=`A sample contains ${k*18} g of water (molar mass 18 g/mol). How many moles of water are present?`;a=k;e=`n=m/M=${k*18}/18=${a} mol.`;}break;
case 8:s='Chemistry';ch='Solutions & Colligative';d='Easy';{const mol=n%100+1,vol=Math.floor(n/100)+1;q=`${mol} mol of solute is present in ${vol} L of solution. Find the molarity in mol/L.`;a=mol/vol;e=`M=n/V=${mol}/${vol}=${a} mol/L.`;}break;
case 9:s='Chemistry';ch='Chemical Kinetics';d='Moderate';{const h=n%5000+1;q=`A first-order reaction has half-life ${h} min. How long does it take to reach 87.5% completion?`;a=3*h;e=`87.5% completion leaves 1/8; this is three half-lives, so t=3×${h}=${a} min.`;}break;
case 10:s='Chemistry';ch='Chemical Equilibrium';d='Easy';{const p=n%14+1;q=`Assuming complete dissociation and negligible water autoionization, find the pH of an acid at 10^-${p} mol/L; the sample volume is ${n} mL.`;a=p;e=`[H⁺]=10^-${p}; pH=−log₁₀[H⁺]=${a}.`;}break;
case 11:s='Mathematics';ch='Sequences & Series';d='Moderate';{const first=n%100+1,diff=Math.floor(n/100)+1,count=n%40+2;q=`Find the sum of ${count} terms of an AP with first term ${first} and common difference ${diff}.`;a=count*(2*first+(count-1)*diff)/2;e=`Sₙ=n/2[2a+(n−1)d]=${a}.`;}break;
case 12:s='Mathematics';ch='Permutations & Combinations';d='Easy';{const total=n+2,r=n%Math.min(8,total-1)+1;let z=1;for(let j=1;j<=r;j++)z=z*(total-r+j)/j;a=Math.round(z);q=`How many groups of ${r} can be selected from ${total} distinct students?`;e=`The count is C(${total},${r})=${a}.`;}break;
case 13:s='Mathematics';ch='Quadratic Equations';d='Easy';{const r1=n%500+1,r2=Math.floor(n/500)+1;q=`A monic quadratic has roots ${r1} and ${r2}. Find the product of its roots.`;a=r1*r2;e=`The product of roots is ${r1}×${r2}=${a}.`;}break;
case 14:s='Mathematics';ch='Matrices & Determinants';d='Easy';{const x=n%500+1,y=Math.floor(n/500)+1;q=`Evaluate the determinant |${x} 0; 0 ${y}|.`;a=x*y;e=`For a diagonal 2×2 matrix, determinant=${x}×${y}=${a}.`;}break;
case 15:s='Mathematics';ch='Integration';d='Moderate';{const k=n%100+1,c=Math.floor(n/100)+1;q=`Evaluate the definite integral of ${c}x from 0 to ${k}.`;a=c*k*k/2;e=`∫₀ᵏ ${c}x dx = ${c}k²/2 = ${a}.`;}break;
case 16:s='Mathematics';ch='Limits, Continuity & Differentiability';d='Easy';{const k=n;q=`Evaluate lim(x→0) sin(${k}x)/x, with angles in radians.`;a=k;e=`Set u=${k}x and use lim(u→0) sin(u)/u=1; the value is ${k}.`;}break;

trons, fill by field strength (weak: high spin), then μ = √(n(n+2)) BM.','GOC':'Carbocation stability: resonance > hyperconjugation > +I. Electron-withdrawing groups destabilise.','Quadratic Equations':'Sum = −b/a, product = c/a. α² + β² = (α+β)² − 2αβ.','Sequences & Series':'AP: Sₙ = n/2 [2a + (n−1)d]. GP: Sₙ = a(rⁿ−1)/(r−1).','Permutations & Combinations':'Selection with no order is C(n,r). Ordered arrangement is P(n,r) = n!/(n−r)!.','Matrices & Determinants':'Expand along the row or column with the most zeros. Watch the sign pattern + − +.','Integration':'Integrate term by term, then subtract the lower limit value from the upper.','Complex Numbers':'|a + bi| = √(a² + b²). Conjugate flips the sign of the imaginary part.','Probability':'P = favourable/total. Write out the sample space before counting.','Straight Lines':'Slope of ax + by + c = 0 is −a/b. Rewrite in y = mx + c if unsure.','Limits, Continuity & Differentiability':'Use lim sin(u)/u = 1 as u → 0, after matching the angle inside and below.','Application of Derivatives':'d/dx xⁿ = n·xⁿ⁻¹. Maxima and minima come from f′(x) = 0.'};

S.advq=S.advq||[];const ADVSEED=[{"id":"PHY-UDM-001","ch":"PHY-UDM","d":"Moderate","t":"mcq","q":"Which of the following physical quantities has the same dimensions as ε₀E², where ε₀ is the permittivity of free space and E is the electric field?","a":[0],"sol":"The energy density of an electric field is ½ε₀E², which is energy per unit volume.\nDimensions: [ML²T⁻²]/[L³] = [ML⁻¹T⁻²].\nThis is the dimension of pressure (force per unit area), so ε₀E² has the same dimensions as pressure.","o":["Pressure","Energy","Force","Momentum"]},{"id":"PHY-UDM-002","ch":"PHY-UDM","d":"Moderate","t":"mcq","q":"L is inductance, C is capacitance. Which quantity has the same dimensions as 1/√(LC)?","a":[0],"sol":"In an LC circuit the angular frequency is ω = 1/√(LC).\nSince ω has dimension T⁻¹, 1/√(LC) has dimension [T⁻¹], the same as frequency.\nCheck: L/R is a time, and LC = (L/R)(RC) has dimension T², so √(LC) is a time.","o":["Frequency","Time","Velocity","Electric current"]},{"id":"PHY-UDM-003","ch":"PHY-UDM","d":"Moderate","t":"num","q":"A quantity is calculated as x = p³q²/√r. The percentage errors in measuring p, q and r are 2%, 1% and 4% respectively. Find the maximum percentage error in x.","a":10,"sol":"For a product of powers, the maximum fractional errors add with weights equal to the powers: Δx/x = 3(Δp/p) + 2(Δq/q) + ½(Δr/r).\nΔx/x = 3(2%) + 2(1%) + ½(4%) = 6% + 2% + 2% = 10%.\nThe error in r is added even though r is in the denominator: errors never cancel in the maximum-error estimate."},{"id":"PHY-UDM-004","ch":"PHY-UDM","d":"Moderate","t":"num","q":"A vernier caliper has a main scale with 1 mm divisions, and 10 vernier divisions equal 9 main-scale divisions. With the jaws closed, the vernier zero lies to the right of the main-scale zero and the 4th vernier division coincides with a main-scale division. While measuring a cylinder, the vernier zero lies just beyond the 23 mm mark and the 7th vernier division coincides. Find the corrected diameter in mm.","a":23.3,"sol":"Least count = 1 mm − 0.9 mm = 0.1 mm.\nZero error = +4 × 0.1 mm = +0.4 mm (vernier zero is to the right, so the instrument reads too much).\nObserved reading = 23 + 7 × 0.1 = 23.7 mm.\nCorrected reading = observed − zero error = 23.7 − 0.4 = 23.3 mm."},{"id":"PHY-UDM-005","ch":"PHY-UDM","d":"Hard","t":"multi","q":"Here η is viscosity, ρ is density, v is speed, r is a length, σ is surface tension and g is acceleration due to gravity. Which of the following combinations are dimensionless?","a":[0,2],"sol":"Use [ρ] = ML⁻³, [η] = ML⁻¹T⁻¹, [σ] = MT⁻², [v] = LT⁻¹.\n(A) ρv²r/σ = (ML⁻³)(L²T⁻²)(L)/(MT⁻²) = 1. Dimensionless (Weber number).\n(B) ηv/(ρr) = (MT⁻²)/(ML⁻²) = L²T⁻². Not dimensionless.\n(C) ρvr/η = (ML⁻³)(LT⁻¹)(L)/(ML⁻¹T⁻¹) = 1. Dimensionless (Reynolds number).\n(D) σ/(ρgr) = (MT⁻²)/(ML⁻¹T⁻²) = L. Not dimensionless.","o":["ρv²r/σ","ηv/(ρr)","ρvr/η","σ/(ρgr)"]},{"id":"PHY-UDM-006","ch":"PHY-UDM","d":"Hard","t":"mcq","q":"In a system of units where force (F), velocity (V) and time (T) are taken as the fundamental quantities, the dimensions of energy are","a":[0],"sol":"Energy = force × distance, and distance = velocity × time.\nSo [Energy] = [F][VT] = [F V T].\nThe other options do not reduce to force times a length: for instance F V T⁻¹ has dimensions of force times acceleration.","o":["[F V T]","[F V T⁻¹]","[F V⁻¹ T]","[F² V T⁻¹]"]},{"id":"PHY-UDM-007","ch":"PHY-UDM","d":"Hard","t":"multi","q":"Here G is the gravitational constant, ħ is the reduced Planck constant, c is the speed of light and m is the mass of an electron. Which of the following have dimensions of length?","a":[0,2,3],"sol":"Use [G] = M⁻¹L³T⁻², [ħ] = ML²T⁻¹, [c] = LT⁻¹.\n(A) Għ = L⁵T⁻³ and c³ = L³T⁻³, so Għ/c³ = L² and its square root is L. Correct (Planck length).\n(B) ħc = ML³T⁻² and ħc/G = M², so the square root is a mass. Not a length.\n(C) ħ/(mc) = ML²T⁻¹/(M·LT⁻¹) = L. Correct (Compton wavelength).\n(D) ħ² = M²L⁴T⁻² and Gm³ = M²L³T⁻², so the ratio is L. Correct.","o":["√(Għ/c³)","√(ħc/G)","ħ/(mc)","ħ²/(Gm³)"]},{"id":"PHY-UDM-008","ch":"PHY-UDM","d":"Hard","t":"num","q":"A quantity Q = hᵃcᵇGᶜ has the dimensions of time, where h is Planck's constant, c is the speed of light and G is the gravitational constant. Find the value of a + b + c.","a":-1.5,"sol":"Write [h] = ML²T⁻¹, [c] = LT⁻¹, [G] = M⁻¹L³T⁻² and require M⁰L⁰T¹.\nMass: a − c = 0.\nLength: 2a + b + 3c = 0.\nTime: −a − b − 2c = 1.\nFrom the first, a = c. Then 5c + b = 0, so b = −5c. The third gives −c + 5c − 2c = 2c = 1, so c = ½.\nThen a = ½, b = −5/2, and a + b + c = ½ − 5/2 + ½ = −3/2 = −1.5 (this is the Planck time √(hG/c⁵) up to a numerical factor)."},{"id":"PHY-UDM-009","ch":"PHY-UDM","d":"Hard","t":"mcq","q":"The frequency f of small oscillations of a liquid drop depends only on its radius r, density ρ and surface tension σ. Using dimensional analysis, f is proportional to","a":[0],"sol":"Let f = k rᵃρᵇσᶜ and use [σ] = MT⁻², [ρ] = ML⁻³.\nTime: −2c = −1, so c = ½.\nMass: b + c = 0, so b = −½.\nLength: a − 3b = 0, so a = −3/2.\nHence f ∝ r^(−3/2) ρ^(−1/2) σ^(1/2) = √(σ/(ρr³)).\nOption B is the reciprocal (a time), the others fail the length balance.","o":["√(σ/(ρr³))","√(ρr³/σ)","√(σr/ρ)","σ/(ρr)"]},{"id":"PHY-UDM-010","ch":"PHY-UDM","d":"Hard","t":"num","q":"The resistance R₁ = V/I is found from V = (100 ± 5) V and I = (10 ± 0.2) A. It is connected in series with R₂ = (5.0 ± 0.1) Ω. Find the maximum percentage error in the equivalent resistance, rounded to two decimal places.","a":5.33,"sol":"R₁ = 100/10 = 10 Ω. Its fractional error is ΔV/V + ΔI/I = 5% + 2% = 7%, so ΔR₁ = 0.7 Ω.\nFor a sum, absolute errors add: ΔR = ΔR₁ + ΔR₂ = 0.7 + 0.1 = 0.8 Ω, and R = 10 + 5 = 15 Ω.\nPercentage error = 0.8/15 × 100 = 5.33%.\nA common trap is to add the percentage errors of R₁ and R₂ directly, which is wrong for a sum."},{"id":"PHY-UDM-011","ch":"PHY-UDM","d":"Hard","t":"num","q":"In a simple pendulum experiment, the length is measured as l = 100.0 cm using a metre scale of least count 0.1 cm. The time for 50 oscillations is 100.0 s, measured with a stopwatch of least count 0.1 s. Find the maximum percentage error in the calculated value of g, using the least counts as the errors.","a":0.3,"sol":"g = 4π²l/T², so Δg/g = Δl/l + 2ΔT/T.\nΔl/l = 0.1/100.0 = 0.1%.\nThe period T = 100.0/50 = 2.0 s has the fractional error of the total time, ΔT/T = 0.1/100.0 = 0.1% (the count of 50 cancels).\nΔg/g = 0.1% + 2(0.1%) = 0.3%.\nTiming 50 oscillations instead of one is exactly what keeps the timing error small."}];{const ids=new Set(S.advq.map(q=>q.id));ADVSEED.forEach(q=>{if(!ids.has(q.id))S.advq.push(q)});save()}let ac=null,ar2={};
const advHave=c=>S.advq.filter(q=>q.ch==c).length;
function advImp(d){const ids=new Set(S.advq.map(q=>q.id)),codes=new Set(ADV.map(x=>x[2]));let ok=0;(Array.isArray(d)?d:[]).forEach(q=>{if(q&&q.id&&codes.has(q.ch)&&q.q&&q.a!=null&&!ids.has(q.id)){ids.add(q.id);S.advq.push(q);ok++}});save();alert(`Imported ${ok} of ${Array.isArray(d)?d.length:0} questions.`);draw()}

let lecHold=0,lecRes=[];
function lecInit(){S.lec=S.lec||{items:[],cur:-1};S.lec.items=S.lec.items||[];if(S.lec.cur==null)S.lec.cur=-1}
lecInit();
function lecParse(u){u=(u||'').trim();let m;
 if(m=u.match(/[?&]list=([\w-]{10,})/))return{type:'playlist',ref:m[1]};
 if(m=u.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/))return{type:'video',ref:m[1]};
 if(/^PL[\w-]{10,}$/.test(u)||/^(UU|OL|FL|RD)[\w-]{10,}$/.test(u))return{type:'playlist',ref:u};
 if(/^[\w-]{11}$/.test(u))return{type:'video',ref:u};
 return null}
const lecHost=()=>S.cfg.yth=='nc'?'www.youtube-nocookie.com':'www.youtube.com',lecUrl=it=>`https://${lecHost()}/embed/${it.type=='playlist'?'videoseries?list='+it.ref+'&':it.ref+'?'}rel=0&modestbranding=1&playsinline=1&iv_load_policy=3`;
function lecSrv(){S.cfg.yth=S.cfg.yth=='nc'?'yt':'nc';save();const it=S.lec.items[S.lec.cur];if(it){$('#lecp').innerHTML=lecFrame(it);toast('Server: '+lecHost())}}
const lecFrame=it=>`<div class="lecw"><iframe src="${lecUrl(it)}" title="${esc(it.title)}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="row" style="margin-top:6px;justify-content:space-between"><b>${esc(it.title)}</b><span><a class="btn s" style="padding:2px 10px;text-decoration:none" target="_blank" rel="noopener" href="${it.type=='playlist'?'https://www.youtube.com/playlist?list=':'https://www.youtube.com/watch?v='}${it.ref}">Open on YouTube</a> <button class="btn s" style="padding:2px 10px" onclick="lecSrv()" title="Use this if the video shows blocked or does not load">Not loading? Switch server</button> <button class="btn s" style="padding:2px 10px" onclick="lecStop()">Close player</button></span></div>`;
function lecHTML(){const it=S.lec.items[S.lec.cur];const warn=location.protocol=='file:'?'<div class="fb bad" style="margin-bottom:8px"><b>Heads up:</b> this page is opened as a local file, and YouTube usually refuses to play embedded videos from local files. Host the file (Netlify Drop, GitHub Pages) or run a local server, then lectures will play here.</div>':'';
 return`<div class="c dgc" id="lec" style="margin:12px 0"><h3 style="margin-top:0">▶ Lectures <span class="mu" style="font-size:13px">only your lectures play here, nothing else</span></h3>${warn}<div id="lecp">${it?lecFrame(it):'<div class="mu">Add a YouTube playlist or lecture link below, then tap it to play. The study timer starts automatically.</div>'}</div>
 <div class="row" style="margin-top:10px"><select id="lcs">${Object.keys(CH).map(s=>`<option>${s}</option>`)}</select><input id="lcl" placeholder="Paste YouTube playlist or video link" style="flex:1;min-width:180px" onkeydown="if(event.key=='Enter')lecAdd()"><input id="lct" placeholder="Title (optional)" style="width:150px"><button class="btn" onclick="lecAdd()">Add</button></div>
 <div id="lecl" style="margin-top:8px"></div>
 <details style="margin-top:8px"><summary><b>Search lectures</b> <span class="mu">(needs your free YouTube Data API key)</span></summary>
 <div class="row" style="margin-top:8px"><input id="lck" type="password" placeholder="YouTube Data API v3 key" value="${esc(S.cfg.ytkey||'')}" style="flex:1;min-width:180px" onchange="S.cfg.ytkey=this.value.trim();save()"></div>
 <div class="row" style="margin-top:6px"><select id="lst"><option value="playlist">Playlists</option><option value="video">Videos</option></select><input id="lsq" placeholder="e.g. Rotational Motion JEE full chapter" style="flex:1;min-width:180px" onkeydown="if(event.key=='Enter')lecSearch()"><button class="btn" onclick="lecSearch()">Search</button></div>

function lecList(){const e=$('#lecl');if(!e)return;const L=S.lec.items;e.innerHTML=L.length?L.map((it,i)=>`<div class="row" style="justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--ln)"><span style="${i==S.lec.cur?'color:var(--gold)':''}"><span style="color:${SUB[it.s]||'#fff'}">●</span> ${it.type=='playlist'?'📚':'🎬'} ${esc(it.title)}</span><span><button class="btn ok" style="padding:2px 10px" onclick="lecPlay(${i})">▶ Play</button> <button class="btn s" style="padding:2px 8px" onclick="lecDel(${i})">✕</button></span></div>`).join(''):'<div class="mu">No lectures saved yet.</div>'}
async function lecAdd(){const p=lecParse($('#lcl').value);if(!p){toast('That is not a YouTube playlist or video link');return}
 let t=$('#lct').value.trim();const s=$('#lcs').value;
 if(!t){try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(p.type=='playlist'?'https://www.youtube.com/playlist?list='+p.ref:'https://www.youtube.com/watch?v='+p.ref));if(r.ok)t=(await r.json()).title}catch(e){}}
 if(!t)t=(p.type=='playlist'?'Playlist ':'Lecture ')+(S.lec.items.length+1);
 S.lec.items.push({...p,title:t,s});save();$('#lcl').value='';$('#lct').value='';lecList();toast('Lecture saved')}
function lecDel(i){S.lec.items.splice(i,1);if(S.lec.cur==i)S.lec.cur=-1;else if(S.lec.cur>i)S.lec.cur--;save();const e=$('#lecp');if(e)e.innerHTML=S.lec.cur>=0?lecFrame(S.lec.items[S.lec.cur]):'<div class="mu">Pick a lecture to play.</div>';lecList()}
function lecPlay(i){const it=S.lec.items[i];if(!it)return;S.lec.cur=i;save();$('#lecp').innerHTML=lecFrame(it);lecList();
 if(!(run&&run.on)){if(!run){const s=$('#ts');if(s)s.value=it.s}lecHold=1;try{tStart()}finally{lecHold=0}lecBtn()}
 $('#lec').scrollIntoView({behavior:'smooth',block:'start'})}
function lecStop(){S.lec.cur=-1;save();$('#lecp').innerHTML='<div class="mu">Pick a lecture to play.</div>';lecList()}

async function lecSearch(){const q=$('#lsq').value.trim(),k=(S.cfg.ytkey||$('#lck').value||'').trim(),ty=$('#lst').value,o=$('#lecr');if(!q)return;if(!k){o.innerHTML='<div class="mu">Paste your YouTube Data API key above first (free from Google Cloud Console).</div>';return}
 S.cfg.ytkey=k;save();o.innerHTML='<div class="mu">Searching…</div>';

  if(d.error){o.innerHTML=`<div class="no">${esc(d.error.message||'Search failed')}</div>`;return}
  lecRes=(d.items||[]).map(x=>({type:ty,ref:ty=='video'?x.id.videoId:x.id.playlistId,title:x.snippet.title,ch:x.snippet.channelTitle,th:(x.snippet.thumbnails.medium||x.snippet.thumbnails.default||{}).url}));
